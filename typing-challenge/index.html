<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Challenge | KNGS</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,Segoe UI,sans-serif;background:#f3f7fc;color:#183452;margin:0}header{background:linear-gradient(110deg,#102b53,#1962a5);padding:25px max(18px,calc((100vw - 1020px)/2));color:white}header a{color:#e0eeff}h1{margin:8px 0}header p{margin:0;color:#e0eeff}main{max-width:1020px;padding:0 16px 40px;margin:22px auto}.panel{background:white;border:1px solid #d4e1ec;padding:20px;border-radius:14px;margin-bottom:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #acc1d4;border-radius:9px}button{background:#195e9e;color:#fff;border:0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #edbb3e}button:disabled{opacity:.5}textarea{width:100%;height:185px;font:14px/1.5 ui-monospace,Consolas,monospace}pre,.output{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;padding:12px;background:#eff5fa;min-height:42px}canvas{width:100%;max-width:500px;border:1px solid #b9cbdc;background:white}label{display:block;font-weight:700;margin:8px 0}.muted{color:#546c83}strong{font-weight:800}.good{color:#137047}.bad{color:#ad3030}@media print{button,header a{display:none}}</style></head><body><header><a href="../">← KNGS Teaching Tools</a><h1>Typing Challenge</h1><p>KS3 · Improve accuracy and speed with short, age-appropriate practice passages</p></header><main><section class="panel"><div class="row"><label for="level">Practice level</label><select id="level"><option value="0">Starter words</option><option value="1">Computer Science vocabulary</option><option value="2">Programming symbols</option></select><button id="new">New passage</button><button id="restart">Restart</button></div><h2>Copy the passage exactly</h2><p id="passage" style="font:20px/1.8 ui-monospace,Consolas,monospace;background:#eff5fa;padding:14px;border-radius:10px"></p><label for="entry">Type here to begin timing</label><textarea id="entry" spellcheck="false" autocomplete="off"></textarea><div class="grid"><p>Time: <strong id="time">0</strong> seconds</p><p>Accuracy: <strong id="accuracy">100%</strong></p><p>Speed: <strong id="wpm">0</strong> WPM</p></div><p id="feedback" class="output" role="status">Start typing when ready.</p></section></main><script>const sets=[['The quick fox jumps over the little gate.','I can type clearly and check my work.','Learning new skills takes time and practice.'],['An algorithm is a sequence of clear instructions.','Binary is a number system that uses zero and one.','A variable stores a value that can change.'],['print("Hello, world!")','if score >= 10: print("Pass")','total = (first + second) * 2']];const $=id=>document.getElementById(id);let target='',started=0,finished=false,index=0,timer=null;function update(){let typed=$('entry').value,n=typed.length,correct=0;for(let i=0;i<n;i++)if(typed[i]===target[i])correct++;let sec=started?(Date.now()-started)/1000:0;$('time').textContent=sec.toFixed(1);$('accuracy').textContent=(n?correct/n*100:100).toFixed(0)+'%';$('wpm').textContent=sec>0?(correct/5/sec*60).toFixed(0):'0';if(typed===target&&n){finished=true;clearInterval(timer);$('entry').disabled=true;$('feedback').textContent='Completed! '+$('accuracy').textContent+' accuracy at '+$('wpm').textContent+' WPM.'}else $('feedback').textContent=(n-correct)+' mismatched characters so far.'}function restart(){clearInterval(timer);started=0;finished=false;$('entry').disabled=false;$('entry').value='';$('time').textContent='0';$('accuracy').textContent='100%';$('wpm').textContent='0';$('feedback').textContent='Start typing when ready.'}$('entry').oninput=()=>{if(finished)return;if(!started){started=Date.now();timer=setInterval(update,100)}update()};$('restart').onclick=restart;$('new').onclick=()=>{index=(index+1)%sets[+$('level').value].length;target=sets[+$('level').value][index];$('passage').textContent=target;restart()};$('level').onchange=()=>{index=-1;$('new').click()};index=-1;$('new').click();</script></body></html>
