<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d59"><title>Parsons Problems | KNGS Teaching Tools</title><style>:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#183452;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#102b53,#1962a5);padding:25px max(20px,calc((100vw - 1050px)/2));color:white}header a{color:#d9ecff}h1{margin:10px 0 5px;font-size:clamp(1.6rem,4vw,2.5rem)}header p{margin:0;color:#e0eeff}main{max-width:1050px;margin:25px auto;padding:0 16px 50px}.panel{background:white;border:1px solid #d3e1ef;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #1238570c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #aabfd7;border-radius:9px;padding:9px;color:#183452}button{background:#185e9e;color:white;border-color:#185e9e;cursor:pointer}button:hover{background:#104978}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #efbc43}textarea{width:100%;min-height:135px;font:15px/1.55 ui-monospace,Consolas,monospace}input[type=number]{width:100px}pre,code,.mono{font:14px/1.5 ui-monospace,Consolas,monospace}pre{white-space:pre-wrap;background:#f0f5fb;border-radius:9px;padding:14px;overflow:auto}.muted{color:#536b86}.good{color:#12633a;font-weight:750}.bad{color:#a23434;font-weight:750}.output{min-height:45px;padding:10px;background:#f0f5fb;border-radius:9px;white-space:pre-wrap}.pill{display:inline-block;padding:4px 9px;border-radius:15px;background:#e9f1fa;font-size:.82rem;font-weight:bold}label{display:block;font-weight:650;margin:10px 0 5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tile{border:1px solid #b9cfe3;padding:11px;border-radius:9px;background:#f1f6fc;margin:7px 0;cursor:pointer}.tile.active{background:#d7e9ff;border-color:#125c9c}canvas{max-width:100%;border:1px solid #c1d1e0;border-radius:10px;background:white}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d1deea;padding:7px;text-align:left}small{color:#536b86}@media(max-width:600px){.panel{padding:14px}}@media print{header,.controls button{display:none}} </style></head><body><header><a href="../">← All KNGS Teaching Tools</a><h1>Parsons Problems</h1><p>KS3 · GCSE J277 · Reorder Python lines to solve progressively harder problems</p></header><main><section class="panel"><div class="row"><label for="task">Challenge</label><select id="task"></select><button id="shuffle">Shuffle lines</button><button id="check">Check answer</button><button id="hint">Hint</button></div><h2 id="question"></h2><p class="muted">Select a line, then use Up or Down to change its position. Indentation is shown by spaces.</p><div id="lines" aria-label="Reorderable Python code"></div><p id="result" class="output" role="status">Arrange the lines, then check.</p><h3>Predict the output or effect</h3><textarea id="prediction" placeholder="Explain what the completed code will do."></textarea></section></main><script>const tasks=[{t:'Count from 1 to 5',a:['for number in range(1, 6):','    print(number)'],h:'A for loop needs a colon followed by an indented statement.'},{t:'Check if a mark is a pass',a:['mark = 68','if mark >= 50:','    print("Pass")','else:','    print("Try again")'],h:'Put the else after the completed if branch.'},{t:'Total a list',a:['scores = [3, 5, 7]','total = 0','for score in scores:','    total = total + score','print(total)'],h:'Initialise total before the loop.'},{t:'Find the largest value',a:['values = [8, 2, 11, 4]','largest = values[0]','for value in values:','    if value > largest:','        largest = value','print(largest)'],h:'The nested assignment has eight spaces.'},{t:'Validate an input',a:['age = -1','while age < 0:','    age = int(input("Age: "))','print("Accepted")'],h:'The input belongs inside the while loop.'},{t:'Create a reusable function',a:['def square(number):','    return number * number','answer = square(7)','print(answer)'],h:'Define the function before calling it.'}];const $=id=>document.getElementById(id);let order=[],selected=-1;tasks.forEach((x,i)=>$('task').add(new Option((i+1)+'. '+x.t,i)));function load(){let t=tasks[Number($('task').value)];$('question').textContent=t.t;order=t.a.map((_,i)=>i);shuffle();$('result').textContent='Arrange the lines, then check.'}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(order.every((n,i)=>n===i))order.reverse();selected=-1;render()}function render(){let a=tasks[Number($('task').value)].a;$('lines').replaceChildren(...order.map((id,i)=>{let row=document.createElement('div');row.className='row tile'+(selected===i?' active':'');let code=document.createElement('code');code.style.flex='1';code.style.whiteSpace='pre-wrap';code.textContent=a[id];let up=document.createElement('button'),down=document.createElement('button');up.textContent='↑';down.textContent='↓';up.setAttribute('aria-label','Move line '+(i+1)+' up');down.setAttribute('aria-label','Move line '+(i+1)+' down');up.disabled=i===0;down.disabled=i===order.length-1;up.onclick=()=>move(i,-1);down.onclick=()=>move(i,1);row.append(code,up,down);return row}))}function move(i,d){[order[i],order[i+d]]=[order[i+d],order[i]];selected=i+d;render()}$('task').onchange=load;$('shuffle').onclick=shuffle;$('hint').onclick=()=>{$('result').textContent=tasks[Number($('task').value)].h};$('check').onclick=()=>{const correct=order.every((v,i)=>v===i);$('result').textContent=correct?'Correct! Now explain the effect in the box below.':'Not quite. Look at the order and indentation, then try again.';$('result').className='output '+(correct?'good':'bad')};$('task').value='0';load();</script></body></html>
