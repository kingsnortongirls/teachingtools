<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algorithm-a-Day | KNGS</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,Segoe UI,sans-serif;background:#f3f7fc;color:#183452;margin:0}header{background:linear-gradient(110deg,#102b53,#1962a5);padding:25px max(18px,calc((100vw - 1020px)/2));color:white}header a{color:#e0eeff}h1{margin:8px 0}header p{margin:0;color:#e0eeff}main{max-width:1020px;padding:0 16px 40px;margin:22px auto}.panel{background:white;border:1px solid #d4e1ec;padding:20px;border-radius:14px;margin-bottom:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #acc1d4;border-radius:9px}button{background:#195e9e;color:#fff;border:0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #edbb3e}button:disabled{opacity:.5}textarea{width:100%;height:185px;font:14px/1.5 ui-monospace,Consolas,monospace}pre,.output{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;padding:12px;background:#eff5fa;min-height:42px}canvas{width:100%;max-width:500px;border:1px solid #b9cbdc;background:white}label{display:block;font-weight:700;margin:8px 0}.muted{color:#546c83}strong{font-weight:800}.good{color:#137047}.bad{color:#ad3030}@media print{button,header a{display:none}}</style></head><body><header><a href="../">← KNGS Teaching Tools</a><h1>Algorithm-a-Day</h1><p>GCSE J277 · A Level H446 · A daily pseudocode tracing and algorithm reasoning question</p></header><main><section class="panel"><div class="row"><button id="today">Today's challenge</button><button id="another">Different challenge</button><span id="date" class="muted"></span></div><h2 id="title"></h2><p id="question"></p><pre id="code"></pre><label for="answer">Your answer</label><input id="answer" style="width:min(100%,450px)" placeholder="Type your answer"><div class="row" style="margin-top:12px"><button id="check">Check answer</button><button id="hint">Hint</button><button id="solution">Show explanation</button></div><p id="result" class="output" role="status"></p><label for="working">Show your working</label><textarea id="working" placeholder="Trace values, make a table or explain your reasoning."></textarea></section></main><script>const tasks=[{t:'Accumulator trace',q:'What value is printed?',c:'total ← 0\nFOR n ← 1 TO 4\n    total ← total + n\nNEXT n\nOUTPUT total',a:'10',h:'Add the integers from 1 to 4.',e:'The running totals are 1, 3, 6, 10.'},{t:'Count a condition',q:'How many values are counted?',c:'count ← 0\nFOR x ← 1 TO 8\n    IF x MOD 2 = 0 THEN\n        count ← count + 1\n    ENDIF\nNEXT x\nOUTPUT count',a:'4',h:'Identify the even numbers.',e:'2, 4, 6 and 8 are even, so count is 4.'},{t:'Search a list',q:'What index is printed? Indices start at zero.',c:'A ← [5, 9, 2, 7]\nFOR i ← 0 TO 3\n    IF A[i] = 2 THEN\n        OUTPUT i\n    ENDIF\nNEXT i',a:'2',h:'Find the position of 2 in the list.',e:'The third item is at index 2.'},{t:'Trace an update',q:'What value is displayed?',c:'a ← 3\nb ← 5\na ← a + b\nb ← a - b\nOUTPUT b',a:'3',h:'Complete the assignments in sequence.',e:'After a becomes 8, b becomes 8 − 5 = 3.'},{t:'Loop power',q:'What value is displayed?',c:'x ← 1\nREPEAT 4 TIMES\n    x ← x * 2\nENDREPEAT\nOUTPUT x',a:'16',h:'Double the value four times.',e:'1 → 2 → 4 → 8 → 16.'},{t:'Boolean logic',q:'Is the result TRUE or FALSE?',c:'a ← TRUE\nb ← FALSE\nOUTPUT a AND NOT b',a:'true',h:'NOT FALSE is TRUE.',e:'TRUE AND TRUE evaluates to TRUE.'},{t:'Complexity classification',q:'What is the Big O complexity?',c:'FOR i ← 1 TO n\n    OUTPUT i\nNEXT i',a:'o(n)',h:'The loop performs n iterations.',e:'Work grows linearly with input n, so O(n).'}];const $=id=>document.getElementById(id);let current=0;function display(i){current=i;let t=tasks[i];$('title').textContent=t.t;$('question').textContent=t.q;$('code').textContent=t.c;$('answer').value='';$('result').textContent='Record your answer before revealing the solution.'}$('today').onclick=()=>{let now=new Date(),day=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000);display(day%tasks.length);$('date').textContent='Local date: '+now.toLocaleDateString('en-GB')};$('another').onclick=()=>{display((current+1)%tasks.length);$('date').textContent='Extra practice'};$('hint').onclick=()=>{$('result').textContent=tasks[current].h};$('solution').onclick=()=>{$('result').textContent='Answer: '+tasks[current].a+'. '+tasks[current].e};$('check').onclick=()=>{let ok=$('answer').value.trim().toLowerCase().replace(/\s+/g,'')===tasks[current].a.toLowerCase();$('result').textContent=ok?'Correct. '+tasks[current].e:'Not yet. Try tracing each line.';$('result').className='output '+(ok?'good':'bad')};$('today').click();</script></body></html>
