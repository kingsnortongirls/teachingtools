<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d59"><title>Web Development Studio | KNGS Teaching Tools</title><style>:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#183452;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#102b53,#1962a5);padding:25px max(20px,calc((100vw - 1050px)/2));color:white}header a{color:#d9ecff}h1{margin:10px 0 5px;font-size:clamp(1.6rem,4vw,2.5rem)}header p{margin:0;color:#e0eeff}main{max-width:1050px;margin:25px auto;padding:0 16px 50px}.panel{background:white;border:1px solid #d3e1ef;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #1238570c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #aabfd7;border-radius:9px;padding:9px;color:#183452}button{background:#185e9e;color:white;border-color:#185e9e;cursor:pointer}button:hover{background:#104978}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #efbc43}textarea{width:100%;min-height:135px;font:15px/1.55 ui-monospace,Consolas,monospace}input[type=number]{width:100px}pre,code,.mono{font:14px/1.5 ui-monospace,Consolas,monospace}pre{white-space:pre-wrap;background:#f0f5fb;border-radius:9px;padding:14px;overflow:auto}.muted{color:#536b86}.good{color:#12633a;font-weight:750}.bad{color:#a23434;font-weight:750}.output{min-height:45px;padding:10px;background:#f0f5fb;border-radius:9px;white-space:pre-wrap}.pill{display:inline-block;padding:4px 9px;border-radius:15px;background:#e9f1fa;font-size:.82rem;font-weight:bold}label{display:block;font-weight:650;margin:10px 0 5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tile{border:1px sol { font-family: Arial; padding: 22px; }\nh1 { color: navy; }',js:'',check:(h)=>/<h1\b/i.test(h)&&/<p\b/i.test(h)&&((h.match(/<li\b/gi)||[]).length>=3),hint:'Include an h1, a paragraph and three list items.'},{brief:'Design an accessible card with a heading, link and a CSS hover rule.',html:'<article class="card"><h2>My favourite subject</h2><p>Explain why.</p><a href="#more">Learn more</a></article>',css:'.card { padding: 20px; border: 2px solid steelblue; border-radius: 10px; }\na:hover { color: darkred; }',js:'',check:(h,c)=>/<h2\b/i.test(h)&&/<a\b/i.test(h)&&/:hover/.test(c),hint:'Use a heading, an anchor element and a :hover CSS selector.'},{brief:'Make the button increase a visible number. Challenge: add a Reset button.',html:'<h1>Counter</h1>\n<p id="number">0</p>\n<button id="plus">Add one</button>',css:'button { padding: 10px; cursor: pointer; }',js:'let count = 0;\ndocument.getElementById("plus").onclick = () => { count++; document.getElementById("number").textContent = count; };',check:(h,c,j)=>/<button\b/i.test(h)&&/addEventListener|onclick/.test(j)&&/textContent|innerText/.test(j),hint:'Handle a click and update textContent.'}];const $=id=>document.getElementById(id);function build(){const html=$('html').value,css=$('css').value.replace(/<\/style/gi,'<\\/style'),js=$('js').value.replace(/<\/script/gi,'<\\/script');return '<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+html+'<script>'+js+'<\\/script></body></html>'}function preview(){$('frame').srcdoc=build();$('feedback').textContent='Preview updated.'}function load(){const x=projects[Number($('lesson').value)];$('html').value=x.html;$('css').value=x.css;$('js').value=x.js;$('brief').textContent=x.brief;preview()}$('load').onclick=load;$('preview').onclick=preview;$('check').onclick=()=>{let x=projects[Number($('lesson').value)];let pass=x.check($('html').value,$('css').value,$('js').value);$('feedback').textContent=pass?'Challenge checks passed. Extend your design.':x.hint;$('feedback').className='output '+(pass?'good':'bad')};$('download').onclick=()=>{let blob=new Blob([build()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kngs-web-project.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};load();</script></body></html>
